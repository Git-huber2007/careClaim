services:
  - type: web
    name: careclaim-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Your Vercel URL, e.g. https://careclaim.vercel.app (comma-separate several)
      - key: CORS_ORIGIN
        sync: false
      # Optional: add HOSPITAL_ACCESS_CODE in the Render dashboard to require a
      # code before an account can be set up as a hospital.
