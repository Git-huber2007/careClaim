<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">CareClaim AI system architecture</title>
        <desc id="architecture-desc">The React app signs in with Supabase Auth and calls the Express API, where auth middleware verifies the token, controllers query Postgres with the service role, the Gemini service gets a flag for each bill line from Google Gemini, and the adjudication math recomputes the payout in code before the verdict is streamed back.</desc>
